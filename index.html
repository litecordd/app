<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiteCord</title>
<style>
:root{
  --bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--hover:#35373c;--sel:#404249;
  --text:#dbdee1;--head:#f2f3f5;--muted:#949ba4;--line:#3f4147;
  --blurple:#5865f2;--blurple-h:#4752c4;--green:#23a55a;--yellow:#f0b232;--red:#f23f43;
  --r1:10px;--r2:16px;--r3:22px;
  --sym:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","Apple Symbols","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.375 "gg sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:var(--r2);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid #00a8fc;outline-offset:1px}

/* ---------- shared form bits ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:#b5bac1;margin-bottom:8px}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{width:100%;background:var(--bg3);border:0;border-radius:var(--r1);padding:10px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 2px var(--blurple)}
.field textarea{resize:vertical}
.field input[type=color]{width:56px;height:40px;padding:0;border:0;background:none;border-radius:var(--r1);vertical-align:middle}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{background:var(--blurple);color:#fff;border:0;border-radius:var(--r1);padding:10px 16px;font-weight:600}
.btn:hover{background:var(--blurple-h)}
.btn:disabled{opacity:.6;cursor:default}
.btn.block{display:block;width:100%}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#c93b3e}
.err{color:#fa777c;font-size:14px;min-height:20px;margin-bottom:8px}

/* ---------- auth ---------- */
.auth{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;
  background:radial-gradient(1100px 600px at 15% 0%,#5865f2 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#eb459e66 0,transparent 60%),#1e1f22}
.authbox{width:min(480px,100%);background:var(--bg);border-radius:var(--r2);padding:32px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.authbox h1{margin:0 0 4px;text-align:center;color:var(--head);font-size:24px}
.authbox .sub{text-align:center;color:var(--muted);margin:0 0 24px}
.switch{margin-top:14px;font-size:14px;color:var(--muted)}
.switch a{color:#00a8fc;cursor:pointer}
.switch a:hover{text-decoration:underline}

/* ---------- avatar + frames ---------- */
.av{position:relative;width:var(--s);height:var(--s);flex:none;margin:calc(var(--s)*.1)}
.av .face{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.42);user-select:none;text-transform:uppercase}
.av .dot{position:absolute;z-index:2;right:-2px;bottom:-2px;width:max(10px,calc(var(--s)*.3));height:max(10px,calc(var(--s)*.3));border-radius:50%;box-shadow:0 0 0 max(2px,calc(var(--s)*.06)) var(--dotbg,var(--bg2))}
.s-online{background:var(--green)}.s-idle{background:var(--yellow)}.s-dnd{background:var(--red)}.s-offline{background:#80848e}

@keyframes spin{to{transform:rotate(1turn)}}
@keyframes pulse{50%{filter:drop-shadow(0 0 9px var(--glow))}}
.rw{position:absolute;inset:-11%;border-radius:50%;pointer-events:none;z-index:0;--glow:#fff;filter:drop-shadow(0 0 3px var(--glow))}
.rw .ring{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(farthest-side,transparent 79%,#000 80%);mask:radial-gradient(farthest-side,transparent 79%,#000 80%)}
.f-gold{--glow:rgba(240,178,50,.7)}
.f-gold .ring{background:conic-gradient(#fff1a8,#f0b232,#b8791a,#f0b232,#fff1a8)}
.f-neon{--glow:#7a5cff}
.f-neon .ring{background:conic-gradient(#00f0ff,#7a5cff,#ff3df2,#00f0ff)}
.f-rainbow{--glow:rgba(255,255,255,.5)}
.f-rainbow .ring{background:conic-gradient(#ff3b3b,#ff9f1a,#ffe14d,#4cd964,#2ec5ff,#5b5bff,#d94dff,#ff3b3b)}
.f-fire{--glow:#ff6a00}
.f-fire .ring{background:conic-gradient(#ff2d00,#ff9d00,#ffd000,#ff9d00,#ff2d00)}
.f-ice{--glow:#7fd8ff}
.f-ice .ring{background:conic-gradient(#e8fbff,#7fd8ff,#3a8dff,#7fd8ff,#e8fbff)}
.f-pixel{--glow:#43b581}
.f-pixel .ring{background:repeating-conic-gradient(#43b581 0 15deg,#1e1f22 15deg 30deg)}
.f-dev{--glow:#4b247a}
.f-dev .ring{background:conic-gradient(#4b247a,#8c5bd6,#4b247a,#8c5bd6,#4b247a)}
@media (prefers-reduced-motion:reduce){.rw,.rw .ring{animation:none!important}}

/* ---------- names + badges ---------- */
.namewrap{display:inline-flex;align-items:center;min-width:0;max-width:100%;vertical-align:middle}
.namewrap .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{flex:none;margin-left:6px;font-family:var(--sym);font-size:.95em;line-height:1;cursor:help;text-shadow:0 0 6px currentColor}
.namewrap.big{font-size:20px;font-weight:700;color:var(--head)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:72px 240px minmax(0,1fr) 240px;height:100vh;height:100dvh}
.app.nomembers{grid-template-columns:72px 240px minmax(0,1fr)}
.app.nomembers .members{display:none}
.rail{background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding-top:12px}
.srv{width:48px;height:48px;border-radius:var(--r3);background:var(--blurple);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;border:0}
.side{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.side-head{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;font-weight:700;color:var(--head);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.channels{flex:1;overflow:auto;padding:8px}
.chtitle{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.ch{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border:0;background:none;border-radius:var(--r1);color:var(--muted);text-align:left;font-weight:500}
.ch:hover{background:var(--hover);color:var(--text)}
.ch.on{background:var(--sel);color:#fff}
.ch.unread{color:#fff;font-weight:700}
.ch .hash{opacity:.7;font-size:20px;line-height:1}
.ch .pip{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#fff}
.userbar{--dotbg:#232428;background:#232428;padding:0 8px;height:56px;flex:none;display:flex;align-items:center;gap:4px}
.userbar .me{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:var(--r1);border:0;background:none;text-align:left}
.userbar .me:hover{background:rgba(79,84,92,.4)}
.me-t{min-width:0;display:flex;flex-direction:column}
.me-t .namewrap{font-size:14px;font-weight:600;color:var(--head)}
.me-t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r1);color:#b5bac1;font-size:18px}
.iconbtn:hover{background:rgba(79,84,92,.4);color:#fff}

.main{--dotbg:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chead{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;box-shadow:0 1px 0 rgba(0,0,0,.25);font-weight:700;color:var(--head)}
.chead .hash{color:var(--muted);font-size:24px;font-weight:400}
.chead .topic{flex:1;min-width:0;font-weight:400;color:var(--muted);font-size:14px;margin-left:6px;padding-left:12px;border-left:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
.welcome{padding:16px 16px 8px;color:var(--muted)}
.welcome h2{margin:0 0 4px;color:var(--head)}
.divider{display:flex;align-items:center;gap:8px;margin:24px 16px 8px;color:var(--muted);font-size:12px;font-weight:600}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.msg{display:flex;align-items:flex-start;gap:16px;padding:2px 16px;margin-top:17px}
.msg:hover{background:rgba(2,2,2,.06)}
.msg.compact{position:relative;margin-top:0;padding-left:80px}
.ctime{position:absolute;left:16px;width:48px;text-align:right;font-size:11px;color:var(--muted);line-height:22px;visibility:hidden}
.msg.compact:hover .ctime{visibility:visible}
.mav{flex:none;cursor:pointer}
.mbody{min-width:0;flex:1}
.mhead{display:flex;align-items:baseline;gap:8px}
.mname{font-weight:500;color:var(--head);cursor:pointer;min-width:0}
.mname:hover .nm{text-decoration:underline}
.mhead time{font-size:12px;color:var(--muted);flex:none}
.mtext{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:0 16px 24px;flex:none}
.composer{display:flex;gap:8px;align-items:center}.composer input{flex:1;min-width:0;width:100%;background:#383a40;border:0;border-radius:var(--r2);padding:11px 16px;outline:none}.composer .send-btn{flex:none;border:0;border-radius:12px;background:var(--blurple);color:#fff;font-weight:700;padding:10px 14px}.composer .send-btn:hover{background:var(--blurple-h)}

.members{--dotbg:var(--bg2);background:var(--bg2);overflow:auto;padding:8px}
.mh{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:16px 8px 4px}
.mem{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 8px;border:0;background:none;border-radius:var(--r1);text-align:left}
.mem:hover{background:var(--hover)}
.mem .namewrap{font-weight:500;color:#b5bac1}
.mem:hover .namewrap{color:#fff}
.mem.off .av,.mem.off .namewrap{opacity:.45}

/* ---------- profile card ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.pcard{--dotbg:#111214;position:relative;width:340px;max-width:100%;background:#111214;border-radius:var(--r2);overflow:hidden;padding-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pcard .banner{height:72px}
.pav{position:absolute;top:18px;left:8px}
.pspacer{height:52px}
.pbody{margin:0 12px;background:#232428;border-radius:var(--r2);padding:12px}
.pname{margin-bottom:2px}
.puser{color:#b5bac1;font-size:14px}
.pbody h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;color:#b5bac1}
.pbody p{margin:0;font-size:14px}
.pbio{white-space:pre-wrap;overflow-wrap:anywhere}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#111214;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip .sym{color:var(--bc);font-family:var(--sym);font-size:14px}

/* ---------- settings ---------- */
.settings{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex}
.snav{flex:1 0 218px;background:var(--bg2);display:flex;justify-content:flex-end;overflow:auto}
.snav-in{width:218px;padding:60px 6px 60px 20px}
.snav-h{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.snav-i{display:block;width:100%;text-align:left;padding:6px 10px;margin-bottom:2px;border:0;border-radius:var(--r1);background:none;color:#b5bac1;font-weight:500}
.snav-i:hover{background:var(--hover);color:var(--text)}
.snav-i.on{background:var(--sel);color:#fff}
.snav-i.danger{color:#fa777c}
.scontent{flex:1 1 800px;overflow:auto}
.scontent-in{max-width:740px;padding:60px 40px 80px}
.scontent h2{margin:0 0 20px;color:var(--head);font-size:20px}
.scontent h3{margin:24px 0 12px;color:var(--head);font-size:16px}
.sub{color:var(--muted);margin:-12px 0 20px;font-size:14px}
.sclose{position:fixed;top:56px;right:56px;width:36px;height:36px;border-radius:50%;border:2px solid #80848e;background:none;color:#b5bac1;display:grid;place-items:center;font-size:14px}
.sclose:hover{background:rgba(255,255,255,.08);color:#fff}
.acct{--dotbg:#1e1f22;background:#1e1f22;border-radius:var(--r2);overflow:hidden;margin-bottom:24px}
.acct .banner{height:96px}
.acct-row{display:flex;align-items:center;gap:12px;padding:12px 16px 16px}
.acct-row .av{margin-top:-44px}
.prof{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.ph{font-size:12px;font-weight:700;text-transform:uppercase;color:#b5bac1;margin-bottom:8px}
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.2);padding:0}
.sw:hover{border-color:#fff}
.frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ftile{--dotbg:var(--bg2);background:var(--bg2);border:2px solid transparent;border-radius:var(--r2);padding:22px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ftile:hover:not(:disabled){background:var(--hover)}
.ftile.on{border-color:var(--blurple)}
.ftile:disabled{opacity:.55;cursor:not-allowed}
.fname{font-weight:600;color:var(--head);font-size:14px}
.fsub{font-size:12px;color:var(--muted)}
.bpreview{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:var(--r2);padding:12px 16px;margin-bottom:20px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid transparent;border-radius:var(--r2);padding:14px}
.bcard:not(.has){opacity:.55}
.bcard.has{border-color:rgba(240,178,50,.35)}
.bsym{width:48px;text-align:center;font-size:34px;font-family:var(--sym);text-shadow:0 0 10px currentColor}
.bname{font-weight:700;color:var(--head)}
.bdesc{font-size:13px;color:var(--muted)}
.bstate{font-size:12px;margin-top:4px;color:#b5bac1}

#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.toast{background:#111214;border-left:4px solid var(--green);border-radius:var(--r1);padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:14px}
.toast.err{border-color:var(--red)}

/* server switcher */
.servers-rail{display:flex;flex-direction:column;align-items:center;gap:10px}
.rail .srv{flex:none;width:48px;height:48px;border-radius:18px;margin:0;background:#35373c;color:#fff;font-size:20px;font-weight:700;border:0;transition:border-radius .12s,background .12s}
.rail .srv:hover,.rail .srv.selected{border-radius:14px;background:#5865f2}
.rail .srv.selected{box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.rail .add-server{color:#3ba55d;font-size:28px;background:#35373c}
.rail .add-server:hover{background:#3ba55d;color:#fff}
.rail{overflow-y:auto;gap:10px}
.rail #openDMs{flex:none}
/* LiteCord additions */
.msg{border-radius:var(--r1)}
.side-head{width:100%;border:0;background:var(--bg2);text-align:left;justify-content:space-between;gap:8px;font-size:16px}
.side-head:hover{background:var(--hover)}
.side-head small{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.12)}
.side-head.lv1{background:linear-gradient(135deg,#3b3f8f,var(--bg2))}
.side-head.lv2{background:linear-gradient(135deg,#7a3b8f,#3b3f8f 60%,var(--bg2))}
.side-head.lv3{background:linear-gradient(135deg,#d64f9a,#7a3b8f 45%,#3b3f8f 75%,var(--bg2))}
.srv.lv1{box-shadow:0 0 0 3px #5865f2}.srv.lv2{box-shadow:0 0 0 3px #b45cff}.srv.lv3{box-shadow:0 0 0 3px #ff73fa,0 0 14px #ff73fa}
.chrow{display:flex;align-items:center;padding-right:4px}
.chrow .chtitle{flex:1}
.ch .x{display:none;margin-left:auto;padding:0 4px;font-size:12px}
.ch:hover .x{display:block}.ch .x:hover{color:var(--red)}
.av .face.img{background-size:cover;background-position:center}
.av .face .emo{font-size:calc(var(--s)*.52);line-height:1}
.avpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.avpick .pv{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:var(--bg3);font-size:24px;padding:0;line-height:1}
.avpick .pv:hover{border-color:var(--blurple)}
.btn.sec{background:#4e5058}.btn.sec:hover{background:#5d6069}
.panel{width:min(460px,100%);background:var(--bg);border-radius:var(--r3);padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.panel h2{margin:0 0 6px;color:var(--head)}
.bar{height:10px;border-radius:999px;background:var(--bg3);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5865f2,#ff73fa)}
.perk{display:flex;gap:8px;padding:8px 12px;border-radius:var(--r1);background:var(--bg2);margin-bottom:6px;font-size:14px;color:var(--muted)}
.perk.on{color:var(--text);outline:1px solid #ff73fa88}
.row{display:flex;gap:8px;margin-top:14px}
.guess{display:flex;justify-content:space-between;background:var(--bg2);border-radius:var(--r1);padding:8px 14px;margin-bottom:6px}
.hot{color:#ff9d42;font-weight:600}.cold{color:#7fd8ff;font-weight:600}
.f-aurora{--glow:#7fffd4}
.f-aurora .ring{background:conic-gradient(#7fffd4,#7b8cff,#ff73fa,#7fffd4)}
@media (max-width:860px){
  .app,.app.nomembers{grid-template-columns:190px minmax(0,1fr)}
  .rail,.members{display:none}
}
@media (max-width:700px){
  .snav{flex:0 0 150px}
  .snav-in{width:150px;padding:48px 6px 0}
  .scontent-in{padding:48px 16px 60px}
  .prof{grid-template-columns:1fr}
  .sclose{top:10px;right:10px}
  .authbox{padding:24px}
}

/* LiteCord mobile layout */
.mobile-nav-toggle{display:none;flex:none}
@media(max-width:760px){
  .app,.app.nomembers{grid-template-columns:56px minmax(0,1fr)}
  .rail{grid-column:1;grid-row:1;position:relative;z-index:21;padding:8px 4px;gap:8px}
  .rail .srv{width:42px;height:42px;flex:none;border-radius:14px}
  .rail .iconbtn{width:42px!important;height:42px!important;margin-top:4px!important}
  .side{position:fixed;z-index:20;left:56px;top:0;bottom:0;width:min(280px,calc(100vw - 56px));box-shadow:12px 0 32px #0008;transform:translateX(-120%);transition:transform .18s ease}
  .mobile-nav-open .side{transform:translateX(0)}
  .mobile-nav-open::before{content:'';position:fixed;inset:0;z-index:19;background:#0008;pointer-events:auto}
  .side{max-width:calc(100vw - 56px)}
  .main{grid-column:2;grid-row:1;min-width:0}
  .members{display:none!important}
  .app,.app.nomembers{grid-template-columns:56px minmax(0,1fr)}
  .mobile-nav-toggle{display:grid}
  .chead{gap:6px;padding:0 8px}
  .chead .topic{display:none}
  .msgs{padding:12px 0 8px}
  .msg{gap:10px;padding:4px 10px}
  .msg.compact{padding-left:58px}
  .composer{padding:0 8px max(10px,env(safe-area-inset-bottom))}
  .prof{grid-template-columns:1fr!important}
  .snav{flex:0 0 130px}
  .snav-in{width:130px;padding:48px 6px 0}
  .scontent-in{padding:48px 12px 60px}
  .panel{padding:16px}
  .modal{padding:10px}
  .authbox{padding:22px}
  .acct-row{flex-wrap:wrap;gap:10px}
  .acct-row .btn{margin-left:0!important}
  .badge-grid,.frame-grid{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
  input,textarea,select,button{touch-action:manipulation}
}
@media(max-width:420px){
  .mav .av{--s:32px!important}
  .msg{gap:8px;padding-left:8px;padding-right:8px}
  .mhead{flex-wrap:wrap;gap:4px}
  .mhead time{font-size:11px}

}

<body>

<div id="auth" class="auth hidden"><div id="authbox" class="authbox"></div></div>

<div id="app" class="app hidden">
  <nav class="rail"><div id="serversRail" class="servers-rail"></div><button class="srv add-server" id="addServer" title="Create server" aria-label="Create server">+</button><button class="iconbtn" id="openDMs" title="Private messages" style="margin-top:12px;width:48px;height:48px;font-size:22px;background:#35373c;border-radius:18px">✉</button></nav>
  <aside class="side">
    <button class="side-head" id="srvhead" title="Boost this server"></button>
    <div class="channels" id="channels"></div>
    <div class="userbar" id="userbar"></div>
  </aside>
  <main class="main">
    <header class="chead">
      <button class="iconbtn mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Open server and channel list">☰</button><span class="hash">#</span><span id="chname"></span>
      <span class="topic" id="chtopic"></span>
      <button class="iconbtn" id="toggleMembers" title="Show or hide members">☰</button>
    </header>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <input id="msginput" type="text" maxlength="2000" autocomplete="off" placeholder="Message">
      <button class="send-btn" id="sendMessage" type="submit" aria-label="Send message">Send</button>
    </form>
  </main>
  <aside class="members" id="members"></aside>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
'use strict';

/* ================================================================
   Small helpers
   ================================================================ */
const $ = (sel, root = document) => root.querySelector(sel);

// Build DOM without innerHTML, so user text can never become markup.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function api(method, url, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (method !== 'GET') opt.body = JSON.stringify(body || {});
  const r = await fetch(url, opt);
  let data = null;
  try { data = await r.json(); } catch { /* no body */ }
  if (!r.ok) {
    const e = new Error((data && data.error) || 'Request failed.');
    e.status = r.status;
    throw e;
  }
  return data;
}

function toast(msg, type = '') {
  const t = h('div', { class: 'toast ' + type, role: 'status' }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3200);
}

const timeStr = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

/* ================================================================
   State
   ================================================================ */
const STATUS_OPTS = [['online', 'Online'], ['idle', 'Idle'], ['dnd', 'Do Not Disturb'], ['invisible', 'Invisible']];
const SWATCHES = ['#5865f2', '#3ba55d', '#faa61a', '#ed4245', '#eb459e', '#1abc9c', '#9b59b6', '#e67e22', '#4e5058'];
const GHOST = { username: 'unknown', displayName: 'Unknown user', avatarColor: '#4e5058', accent: '#4e5058',
  frame: 'none', badges: [], bio: '', status: 'offline', createdAt: 0 };

const S = {
  me: null, catalog: null, servers: [], server: null, channels: [], channelsByServer: new Map(), channelId: null,
  users: new Map(), messages: new Map(), loaded: new Set(), unread: new Set(),
  es: null, hadOpen: false, modal: null, settings: null,
};
const getUser = id => S.users.get(id) || { ...GHOST, id };

/* ================================================================
   Building blocks: avatar (with frame), name (with badges)
   ================================================================ */
function avatar(u, size = 40, { status = false } = {}) {
  const el = h('div', { class: 'av', style: `--s:${size}px;--c:${u.avatarColor}` });
  if (u.frame && u.frame !== 'none') {
    el.append(h('div', { class: 'rw f-' + u.frame }, h('div', { class: 'ring' })));
  }
  const a = u.avatar || '', emo = a.startsWith('preset:') && S.catalog?.presets?.[a.slice(7)];
  el.append((a.startsWith('data:image/') || a.startsWith('/api/avatar/')) ? h('div', { class: 'face img', style: `background-image:url("${a}")` })
    : emo ? h('div', { class: 'face' }, h('span', { class: 'emo' }, emo))
    : h('div', { class: 'face' }, [...String(u.displayName || u.username || '?').trim()][0] || '?'));
  if (status) el.append(h('span', { class: 'dot s-' + (u.status || 'offline') }));
  return el;
}

// Display name followed by its badges, e.g.  Alex ⛊
function nameEl(u, cls = '') {
  const owned = (u.badges || []).filter(id => S.catalog?.badges?.[id]);
  const selected = Array.isArray(u.shownBadges) ? u.shownBadges.filter(id => owned.includes(id)) : owned;
  const max = owned.includes('dev') ? 3 : owned.includes('nitro') ? 2 : 1;
  const badges = selected.slice(0, max).map(id => S.catalog?.badges?.[id]).filter(Boolean).map(b =>
    h('span', { class: 'badge', title: b.name, 'aria-label': b.name + ' badge', style: `color:${b.color}` }, b.symbol));
  return h('span', { class: 'namewrap ' + cls }, h('span', { class: 'nm' }, u.displayName), badges);
}

function profileCard(u) {
  const joined = new Date(u.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  const badges = (u.badges || []).map(id => S.catalog?.badges?.[id]).filter(Boolean);
  return h('div', { class: 'pcard' },
    h('div', { class: 'banner', style: u.banner ? `background-color:${u.accent};background-image:url("${u.banner}");background-size:cover;background-position:center` : `background:${u.accent}` }),
    h('div', { class: 'pav' }, avatar(u, 88, { status: true })),
    h('div', { class: 'pspacer' }),
    h('div', { class: 'pbody' },
      h('div', { class: 'pname' }, nameEl(u, 'big')),
      h('div', { class: 'puser' }, '@' + u.username),
      badges.length ? h('div', { class: 'chips' }, badges.map(b =>
        h('span', { class: 'chip', title: b.description, style: `--bc:${b.color}` }, h('span', { class: 'sym' }, b.symbol), b.name))) : null,
      u.bio ? [h('h4', null, 'About me'), h('p', { class: 'pbio' }, u.bio)] : null,
      h('h4', null, 'Member since'), h('p', null, joined)));
}

/* ================================================================
   Rendering the app shell
   ================================================================ */
function statusLabel(u) { return (STATUS_OPTS.find(o => o[0] === u.statusPref) || [, 'Online'])[1]; }

const canDelete = c => !!S.me && c.id !== 'general' && (c.createdBy === S.me.id || (S.me.badges || []).includes('dev'));
function renderChannels() {
  $('#channels').replaceChildren(
    h('div', { class: 'chrow' }, h('div', { class: 'chtitle' }, 'Text Channels'),
      h('button', { class: 'iconbtn', title: 'Create channel', 'aria-label': 'Create channel', onclick: openNewChannel }, '+')),
    ...(Array.isArray(S.channels) ? S.channels : []).filter(Boolean).map(c => h('button', {
      class: 'ch' + (c.id === S.channelId ? ' on' : '') + (S.unread.has(c.id) ? ' unread' : ''),
      onclick: () => selectChannel(c.id),
    }, h('span', { class: 'hash' }, '#'), c.name, ...(c.badges||[]).map(bid => S.catalog?.badges?.[bid] ? h('span',{class:'badge',title:S.catalog.badges[bid].name,style:`color:${S.catalog.badges[bid].color}`},S.catalog.badges[bid].symbol) : null), S.unread.has(c.id) ? h('span', { class: 'pip' }) : null,
      canDelete(c) ? h('span', { class: 'x', title: 'Delete channel', onclick: e => { e.stopPropagation(); delChannel(c); } }, '✕') : null)));
}

function renderServersRail() {
  const rail = $('#serversRail');
  if (!rail) return;
  rail.replaceChildren(...(Array.isArray(S.servers) ? S.servers : []).filter(Boolean).map(s => h('button', {
    class: 'srv' + (S.server && S.server.id === s.id ? ' selected' : ''),
    title: s.name, 'aria-label': 'Switch to ' + s.name,
    onclick: () => switchServer(s.id)
  }, [...s.name.trim()][0]?.toUpperCase() || 'S')));
}
async function switchServer(id) {
  try {
    const d = await api('POST', '/api/servers/' + encodeURIComponent(id) + '/select', {});
    S.server = d.server && typeof d.server === 'object' ? d.server : S.server;
    if (!S.server) throw new Error('The server response did not include a server.');
    // Keep every server in the rail; older server responses may omit the list.
    S.servers = Array.isArray(d.servers) && d.servers.length ? d.servers.filter(Boolean) : await api('GET', '/api/servers').then(x => Array.isArray(x?.servers) ? x.servers.filter(Boolean) : [S.server]);
    S.channels = Array.isArray(d.channels) ? d.channels.filter(Boolean) : (Array.isArray(S.server.channels) ? S.server.channels.filter(Boolean) : []);
    S.channelsByServer.set(S.server.id, S.channels);
    if (d.me && typeof d.me === 'object') S.me = { ...S.me, ...d.me };
    if (S.me?.id) S.users.set(S.me.id, S.me); S.loaded = new Set(); S.messages = new Map(); S.unread = new Set();
    S.channelId = S.channels[0]?.id || null;
    renderServersRail(); renderAll();
    $('#app')?.classList.remove('mobile-nav-open');
    if (S.channelId) await selectChannel(S.channelId);
  } catch (e) { toast(e.message, 'err'); }
}
function openCreateServer() {
  const name = h('input', { type: 'text', maxlength: 40, placeholder: 'My server', required: true });
  const err = h('div', { class: 'err', role: 'alert' });
  const form = h('form', { onsubmit: async e => {
    e.preventDefault(); err.textContent = '';
    try {
      const d = await api('POST', '/api/servers', { name: name.value });
      S.servers = Array.isArray(d.servers) ? d.servers : await api('GET', '/api/servers').then(x => x.servers || [d.server]);
      S.server = d.server; S.channels = Array.isArray(d.server?.channels) ? d.server.channels : [];
      S.channelsByServer.set(S.server.id, S.channels);
      S.me = { ...S.me, ...d.me }; S.users.set(S.me.id, S.me);
      S.channelId = S.channels[0]?.id || null; S.loaded = new Set(); S.messages = new Map(); S.unread = new Set();
      closeModal(); renderServersRail(); renderAll(); if (S.channelId) await selectChannel(S.channelId);
      toast('Server created');
    } catch (x) { err.textContent = x.message; }
  } }, field('Server name', name, 'Create a separate space with its own channels, messages and boosts.'), err,
      h('button', { class: 'btn block', type: 'submit' }, 'Create server'));
  openModal(h('div', { class: 'panel' }, h('h2', null, 'Create a server'), form));
  name.focus();
}
function renderServer() {
  const s = S.server;
  const b = $('#srvhead');
  if (!s) { b.className = 'side-head'; b.replaceChildren('LiteCord'); return; }
  b.className = 'side-head lv' + (s.level || 0);
  b.replaceChildren(s.name, h('small', null, s.level ? 'Level ' + s.level : '❖ ' + s.boosts));
  $('#srvhead').title = 'Boost this server';
  $('.side .side-head').className = 'side-head lv' + s.level;
  renderServersRail();
}

function openNewChannel() {
  const nm = h('input', { type: 'text', maxlength: 24, placeholder: 'new-channel', required: true });
  const tp = h('input', { type: 'text', maxlength: 100, placeholder: 'Optional' });
  const roleChecks = h('div', { class: 'acct', style: 'padding:12px;display:grid;gap:8px' },
    h('div', { class: 'hint' }, 'Who can send messages? Leave all unchecked to allow everyone.'),
    ...(S.server.roles||[]).map(r => { const cb=h('input',{type:'checkbox',value:r.id}); return h('label',{style:'display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px'},cb,h('span',{style:`color:${r.color}`},r.name)); }));
  const badgeChecks = h('div', { class: 'acct', style: 'padding:12px;display:grid;gap:8px' },
    h('div', { class: 'hint' }, 'Optional badges shown beside this channel.'),
    ...Object.values(S.catalog.badges).map(b => { const cb=h('input',{type:'checkbox',value:b.id}); return h('label',{style:'display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px'},cb,h('span',{style:`color:${b.color}`},b.symbol+' '+b.name)); }));
  const err = h('div', { class: 'err', role: 'alert' });
  const form = h('form', { onsubmit: async e => {
    e.preventDefault(); err.textContent = '';
    try {
      const writeRoles=[...roleChecks.querySelectorAll('input:checked')].map(x=>x.value);
      const badges=[...badgeChecks.querySelectorAll('input:checked')].map(x=>x.value);
      const { channel } = await api('POST', '/api/channels', { name: nm.value, topic: tp.value, writeRoles, badges });
      if (!S.channels.some(c => c.id === channel.id)) S.channels.push(channel);
      S.channelsByServer.set(S.server.id,S.channels); closeModal(); renderChannels(); selectChannel(channel.id);
    } catch (x) { err.textContent = x.message; }
  } }, field('Channel name', nm, `${S.channels.length} of ${S.server.channelCap} channels used. Boosting the server raises the limit.`),
     field('Topic', tp), field('Roles allowed to type',roleChecks), field('Channel badges',badgeChecks), err, h('button', { class: 'btn block', type: 'submit' }, 'Create channel'));
  openModal(h('div', { class: 'panel' }, h('h2', null, 'Create channel'), form));
  nm.focus();
}

async function delChannel(c) {
  if (!confirm(`Delete #${c.name} and all its messages?`)) return;
  try { await api('DELETE', '/api/channels/' + c.id); } catch (e) { toast(e.message, 'err'); }
}

function openBoost() {
  const s = S.server, me = S.me, left = me.boostSlots - me.boostsUsed, next = s.levels[s.level + 1];
  const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const perks = [1, 2, 3].map(i => h('div', { class: 'perk' + (s.level >= i ? ' on' : '') }, h('b', null, 'Level ' + i),
    `${pl(s.levels[i], 'boost')} · up to ${s.caps[i]} channels · richer header${i === 3 ? ' + glowing icon' : ''}`));
  openModal(h('div', { class: 'panel' },
    h('h2', null, s.name), h('div', { class: 'hint', style: 'margin:0 0 8px' }, `${pl(s.boosts, 'boost')} · Level ${s.level}`),
    next != null ? [h('div', { class: 'bar' }, h('i', { style: `width:${Math.min(100, s.boosts / next * 100)}%` })),
      h('div', { class: 'hint', style: 'margin:0 0 12px' }, `${pl(next - s.boosts, 'more boost')} to reach Level ${s.level + 1}`)]
      : h('div', { class: 'hint', style: 'margin-bottom:12px' }, 'Max level reached.'),
    perks,
    h('p', { class: 'hint' }, `You’re using ${me.boostsUsed} of ${me.boostSlots} boosts.${me.badges.includes('nitro') ? '' : ' Nitro gives you 2 more.'} Boosters get the ❖ badge.`),
    h('div', { class: 'row' },
      h('button', { class: 'btn', disabled: left <= 0, onclick: () => boost('POST') }, left > 0 ? 'Boost this server' : 'No boosts left'),
      me.boostsUsed ? h('button', { class: 'btn sec', onclick: () => boost('DELETE') }, 'Remove a boost') : null)));
}
async function boost(method) {
  try {
    const r = await api(method, '/api/boost');
    S.server = r.server; renderServer(); applyMe(r.me);
    toast(method === 'POST' ? 'Server boosted' : 'Boost removed');
    openBoost();
  } catch (e) { toast(e.message, 'err'); }
}

function pickImage(f, done) {
  if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d'), side = Math.min(img.width, img.height);
    ctx.fillStyle = '#1e1f22'; ctx.fillRect(0, 0, 128, 128);
    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
    URL.revokeObjectURL(url);
    done({ image: c.toDataURL('image/jpeg', 0.88) });
  };
  img.onerror = () => toast('That file isn’t a readable image.', 'err');
  img.src = url;
}

function pickBanner(f) {
  if (!f) return;
  if (!f.type.startsWith('image/')) { toast('Choose an image file.', 'err'); return; }
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = async () => {
    try {
      const c = document.createElement('canvas'); c.width = 1000; c.height = 300;
      const ctx = c.getContext('2d'), scale = Math.max(c.width / img.width, c.height / img.height);
      const w = img.width * scale, hgt = img.height * scale;
      ctx.drawImage(img, (c.width-w)/2, (c.height-hgt)/2, w, hgt);
      const {me} = await api('POST','/api/me/banner',{image:c.toDataURL('image/jpeg',0.82)});
      applyMe(me); toast('Banner updated');
      if (S.settings) renderSettings();
    } catch(e) { toast(e.message,'err'); }
    finally { URL.revokeObjectURL(url); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That file isn’t a readable image.', 'err'); };
  img.src = url;
}

function tabNitro() {
  const box = h('div');
  const isHot = t => ['Warmer', 'Burning hot', 'Hot', 'Warm'].includes(t);
  const draw = st => {
    if (st.hasNitro) {
      box.replaceChildren(h('div', { class: 'bpreview' }, avatar(S.me, 40), nameEl(S.me, 'big')),
        h('p', null, 'You have Nitro: the ✦ badge, the Nitro Aurora frame, 4000-character messages and 2 extra server boosts.'));
      return;
    }
    const left = st.total - st.guesses.length, max = S.catalog.nitro.max;
    const input = h('input', { type: 'number', min: 1, max, step: 1, required: true, placeholder: `1–${max}` });
    const err = h('div', { class: 'err', role: 'alert' });
    const waiting = !st.active && st.waitMs > 0;
    box.replaceChildren(
      h('p', { class: 'sub', style: 'margin-top:-8px' }, `Nitro is free. Guess my number from 1 to ${max} in ${st.total} tries. After each guess I’ll say warmer or colder.`),
      ...st.guesses.map((g, i) => h('div', { class: 'guess' }, h('span', null, `#${i + 1} · ${g.n}`), h('span', { class: isHot(g.hint) ? 'hot' : 'cold' }, g.hint))),
      st.secret ? h('p', null, `Out of guesses. The number was ${st.secret}.`) : null,
      waiting ? h('p', { class: 'hint' }, `Next round in ${Math.ceil(st.waitMs / 60000)} min.`)
        : h('form', { onsubmit: async e => {
            e.preventDefault(); err.textContent = '';
            try {
              const r = await api('POST', '/api/nitro/guess', { n: Number(input.value) });
              if (r.nitro.hasNitro) { applyMe(r.me); toast('You won Nitro!'); } else draw(r.nitro);
            } catch (x) { err.textContent = x.message; }
          } }, field(st.active ? `${left} ${left === 1 ? 'guess' : 'guesses'} left` : 'Your guess', input), err,
          h('button', { class: 'btn', type: 'submit' }, st.active ? 'Guess' : 'Start a round')));
  };
  api('GET', '/api/nitro').then(r => draw(r.nitro)).catch(e => { box.textContent = e.message; });
  return [h('h2', null, 'Nitro'), box];
}

function renderMembers() {
  const all = [...S.users.values()].sort((a, b) => a.displayName.localeCompare(b.displayName));
  const on = all.filter(u => u.status !== 'offline');
  const off = all.filter(u => u.status === 'offline');
  const row = u => h('button', { class: 'mem' + (u.status === 'offline' ? ' off' : ''), onclick: () => openProfile(u.id) },
    avatar(u, 32, { status: true }), nameEl(u));
  $('#members').replaceChildren(
    h('div', { class: 'mh' }, `Online — ${on.length}`), ...on.map(row),
    h('div', { class: 'mh' }, `Offline — ${off.length}`), ...off.map(row));
}

function renderUserbar() {
  const u = S.me;
  $('#userbar').replaceChildren(
    h('button', { class: 'me', onclick: () => openProfile(u.id), title: 'View your profile' },
      avatar(u, 32, { status: true }),
      h('div', { class: 'me-t' }, nameEl(u), h('small', null, statusLabel(u)))),
    h('button', { class: 'iconbtn', title: 'User Settings', 'aria-label': 'User Settings', onclick: () => openSettings('account') }, '⚙'));
}

function renderHeader() {
  const ch = S.channels.find(c => c.id === S.channelId);
  if (!ch) {
    $('#chname').textContent = '';
    $('#chtopic').textContent = '';
    $('#msginput').placeholder = 'Select a channel';
    $('#msginput').disabled = true;
    document.title = 'LiteCord';
    return;
  }
  $('#msginput').disabled = false;
  $('#chname').textContent = '# ' + (ch.name || 'unnamed-channel') + (ch.badges||[]).map(id=>S.catalog?.badges?.[id] ? ' '+S.catalog.badges[id].symbol : '').join('');
  $('#chtopic').textContent = ch.topic || '';
  $('#msginput').placeholder = 'Message #' + (ch.name || 'channel');
  document.title = '#' + (ch.name || 'channel') + ' | LiteCord';
}

function rowsFor(msg, prev) {
  const out = [];
  const d = new Date(msg.ts);
  const newDay = !prev || new Date(prev.ts).toDateString() !== d.toDateString();
  if (newDay) {
    out.push(h('div', { class: 'divider' }, h('span', null,
      d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))));
  }
  const u = getUser(msg.userId);
  const text = h('div', { class: 'mtext' }, msg.content);
  if (!newDay && prev.userId === msg.userId && msg.ts - prev.ts < 5 * 60000) {
    out.push(h('div', { class: 'msg compact' }, h('span', { class: 'ctime' }, timeStr(msg.ts)), text));
  } else {
    out.push(h('div', { class: 'msg' },
      h('div', { class: 'mav', onclick: () => openProfile(u.id) }, avatar(u, 40)),
      h('div', { class: 'mbody' },
        h('div', { class: 'mhead' },
          h('span', { class: 'mname', onclick: () => openProfile(u.id) }, nameEl(u)),
          h('time', null, timeStr(msg.ts))),
        text)));
  }
  return out;
}

function renderMessages(keepScroll = false) {
  const box = $('#msgs');
  const top = box.scrollTop;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const list = (S.messages.get(S.channelId) || []).slice(-150);
  const ch = S.channels.find(c => c.id === S.channelId);
  box.replaceChildren();
  if (!ch) {
    box.append(h('div', { class: 'welcome' }, h('h2', null, 'Welcome to LiteCord'), h('p', null, 'Select or create a channel to get started.')));

/* ================================================================
   Channels + messages
   ================================================================ */
async function selectChannel(id) {
  const chosen = S.channels.find(c => c.id === id);
  if (!chosen) {
    S.channelId = null;
    renderChannels(); renderHeader(); renderMessages();
    return;
  }
  S.channelId = id;
  const requestedServerId = S.server?.id;
  S.unread.delete(id);
  renderChannels();
  renderHeader();
  if (!S.loaded.has(id)) {
    $('#msgs').replaceChildren(h('div', { class: 'welcome' }, 'Loading messages…'));
    try {
      const { messages } = await api('GET', `/api/channels/${encodeURIComponent(id)}/messages`);
      if (S.server?.id !== requestedServerId || S.channelId !== id) return;
      S.messages.set(id, Array.isArray(messages) ? messages.slice(-150) : []);
      S.loaded.add(id);
    } catch (e) { toast(e.message, 'err'); return; }
  }
  if (S.channelId === id) renderMessages();
}

function markUnread(channelId) { S.unread.add(channelId); renderChannels(); }

function addMessage(msg, mine = false) {
  if (!S.loaded.has(msg.channelId)) {
    if (msg.userId !== S.me.id) markUnread(msg.channelId);
    return;
  }
  const list = S.messages.get(msg.channelId);
  if (list.some(m => m.id === msg.id)) return;
  list.push(msg);
  if (list.length > 150) list.shift();
  if (msg.channelId !== S.channelId) {
    if (msg.userId !== S.me.id) markUnread(msg.channelId);
    return;
  }
  if (list.length === 1) { renderMessages(); return; }
  const box = $('#msgs');
  const stick = mine || box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.append(...rowsFor(msg, list[list.length - 2]));
  if (stick) box.scrollTop = box.scrollHeight;
}

   ================================================================ */
function applyMe(me) {
  S.me = { ...S.me, ...me };
  S.users.set(S.me.id, S.me);
  renderUserbar(); renderMembers(); renderMessages(true);
  if (S.settings && ['frames', 'badges', 'nitro'].includes(S.settings.tab)) renderSettings();
}

function onUser(u) {
  const prev = S.users.get(u.id);
  const visual = !prev || ['displayName', 'avatarColor', 'frame', 'badges'].some(k => JSON.stringify(prev[k]) !== JSON.stringify(u[k]));
  if (u.id === S.me.id) { applyMe(u); return; }
  if (!S.users.has(u.id)) return;
  S.users.set(u.id, u);
  renderMembers();
  if (visual) renderMessages(true);
}

async function resync() {
  try {
    const d = await api('GET', '/api/bootstrap');
    S.users = new Map(d.users.map(u => [u.id, u]));
    S.me = { ...S.me, ...d.me };
    S.server = d.server; S.servers = d.servers || [d.server]; S.channels = d.channels; S.channelsByServer.set(d.server.id, d.channels);
    S.users.set(S.me.id, S.me);
    const currentChannel = S.channels.find(c => c.id === S.channelId) || S.channels[0];
    S.channelId = currentChannel?.id || null;
    S.loaded = new Set();
    if (S.channelId) {
      S.messages.set(S.channelId, ((await api('GET', `/api/channels/${encodeURIComponent(S.channelId)}/messages`)).messages || []).slice(-150));
      S.loaded.add(S.channelId);
    }
    renderAll();
    if (!S.channelId) { renderHeader(); renderMessages(); }
  } catch (err) { console.warn('Live resync failed; waiting for reconnect', err); }
}

function connect() {
  if (S.es) S.es.close();
  const es = new EventSource('/api/events');
  S.es = es;
  es.onopen = () => { if (S.hadOpen) resync(); S.hadOpen = true; };
  es.onerror = () => { /* EventSource retries transient disconnects automatically. */ };
  const readEvent = ev => { try { return JSON.parse(ev.data); } catch (err) { console.warn('Ignoring invalid live update', err); return null; } };
  es.addEventListener('chat', ev => { const d = readEvent(ev); if (d && d.serverId === S.server?.id && d.message) addMessage(d.message); });
  es.addEventListener('user', ev => { const d = readEvent(ev); if (d?.user?.id) onUser(d.user); });
  es.addEventListener('server', ev => { const d = readEvent(ev); if (d && d.serverId === S.server?.id && d.server) { S.server = d.server; renderServer(); } });
  es.addEventListener('catalog', ev => { const d = readEvent(ev); if (!d?.catalog) return; S.catalog = d.catalog; renderMembers(); renderMessages(true); if (S.settings) renderSettings(); });
  es.addEventListener('channels', ev => {
    const d = readEvent(ev); if (!d || d.serverId !== S.server?.id || !Array.isArray(d.channels)) return;
    S.channels = d.channels; S.channelsByServer.set(S.server.id,d.channels);
    if (S.channels.some(c => c.id === S.channelId)) { renderChannels(); renderHeader(); } else selectChannel(S.channels[0]?.id || null);
  });
  es.addEventListener('servers', ev => { const d = readEvent(ev); if (d && d.userId === S.me?.id && Array.isArray(d.servers)) { S.servers = d.servers; renderServersRail(); } });
}

/* ================================================================
   Sign in / register
   ================================================================ */
function showAuth() {
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
  renderAuth('login');
}

function renderAuth(mode) {
  const reg = mode === 'register';
  const err = h('div', { class: 'err', role: 'alert' });
  const un = h('input', { type: 'text', autocomplete: 'username', required: true, maxlength: 20, autofocus: true });
  const dn = h('input', { type: 'text', maxlength: 32, placeholder: 'Optional' });
  const pw = h('input', { type: 'password', required: true, maxlength: 128, autocomplete: reg ? 'new-password' : 'current-password' });
  const pw2 = h('input', { type: 'password', required: true, maxlength: 128, autocomplete: 'new-password' });
  const btn = h('button', { class: 'btn block', type: 'submit' }, reg ? 'Create account' : 'Log in');
  const form = h('form', {
    onsubmit: async e => {
      e.preventDefault();
      err.textContent = '';
      if (reg && pw.value !== pw2.value) { err.textContent = 'Passwords do not match.'; return; }
      btn.disabled = true;
      try {
        await api('POST', reg ? '/api/register' : '/api/login', { username: un.value.trim(), password: pw.value, displayName: dn.value });
        await boot();
      } catch (ex) { err.textContent = ex.message; }
      finally { btn.disabled = false; }
    },
  },
    field('Username', un, reg ? '3–20 characters: letters, numbers and underscores.' : null),
    reg ? field('Display name', dn, 'Shown in chat. You can change it later.') : null,
    field('Password', pw, reg ? 'At least 8 characters.' : null),
    reg ? field('Confirm password', pw2) : null,
    err, btn);

  $('#authbox').replaceChildren(
    h('h1', null, reg ? 'Create an account' : 'Welcome back'),
    h('p', { class: 'sub' }, reg ? 'Join the conversation on LiteCord.' : 'Log in to pick up where you left off.'),
    form,
    h('div', { class: 'switch' }, reg ? 'Already have an account? ' : 'Need an account? ',
      h('a', { role: 'button', tabindex: '0', onclick: () => renderAuth(reg ? 'login' : 'register'),
        onkeydown: e => { if (e.key === 'Enter') renderAuth(reg ? 'login' : 'register'); } }, reg ? 'Log in' : 'Register')));
  un.focus();
}

  try {
    const response = await api('GET','/api/dms/users');
    const users = Array.isArray(response?.users) ? response.users : [];
    const list = h('div', {style:'display:flex;flex-direction:column;gap:6px;margin-top:14px;max-height:60vh;overflow:auto'});
    if (!users.length) list.append(h('p',{class:'hint'},'No other members yet. Ask a friend to register.'));
    users.forEach(u => list.append(h('button',{class:'mem',style:'width:100%;background:var(--bg2)',onclick:()=>openDM(u.id)},avatar(u,32),nameEl(u),h('span',{style:'margin-left:auto;color:var(--muted)'},'Message →'))));
    openModal(h('div',{class:'panel'},h('h2',null,'Private messages'),h('p',{class:'hint'},'Choose a LiteCord member to open a private conversation.'),list));
  } catch(e) { toast(e.message,'err'); }
}

/* ================================================================
   Boot
   ================================================================ */
function init(d) {
  // Normalize bootstrap data so a missing optional field never crashes the UI.
  d = d && typeof d === 'object' ? d : {};
  S.me = d.me && typeof d.me === 'object' ? d.me : { id: 'local-user', username: 'User', displayName: 'User', badges: [], shownBadges: [] };
  S.catalog = d.catalog && typeof d.catalog === 'object' ? d.catalog : { badges: {}, frames: {} };
  S.catalog.badges = S.catalog.badges && typeof S.catalog.badges === 'object' ? S.catalog.badges : {};
  const fallbackServer = d.server && typeof d.server === 'object' ? d.server : { id: 'general', name: 'LiteCord', channels: [], level: 0, boosts: 0 };
  S.server = fallbackServer;
  S.servers = (Array.isArray(d.servers) ? d.servers : []).filter(s => s && typeof s === 'object');
  if (!S.servers.some(s => s.id === fallbackServer.id)) S.servers.unshift(fallbackServer);
  S.channels = (Array.isArray(d.channels) ? d.channels : Array.isArray(fallbackServer.channels) ? fallbackServer.channels : []).filter(c => c && typeof c === 'object');
  S.channelsByServer = S.channelsByServer instanceof Map ? S.channelsByServer : new Map();
  S.channelsByServer.set(fallbackServer.id, S.channels);
  const users = Array.isArray(d.users) ? d.users.filter(u => u && typeof u === 'object' && u.id) : [];
  S.users = new Map(users.map(u => [u.id, u]));
  if (S.me.id) S.users.set(S.me.id, S.me);
  S.me.badges = Array.isArray(S.me.badges) ? S.me.badges : [];
  S.me.shownBadges = Array.isArray(S.me.shownBadges) ? S.me.shownBadges : [];
  S.me.status = S.me.statusPref === 'invisible' ? 'offline' : (S.me.statusPref || S.me.status || 'online');
  S.messages = new Map(); S.loaded = new Set(); S.unread = new Set(); S.hadOpen = false;
  $('#auth')?.classList.add('hidden');
  $('#app')?.classList.remove('hidden');
  renderServer(); renderServersRail(); renderMembers(); renderUserbar();
  const addServer = $('#addServer');
  if (addServer && !addServer.dataset.bound) { addServer.dataset.bound = '1'; addServer.addEventListener('click', openCreateServer); }
  if (S.channels[0]?.id) selectChannel(S.channels[0].id);
  else { S.channelId = null; renderHeader(); renderMessages(); }
  connect();
}
async function boot() {
  try {
    init(await api('GET', '/api/bootstrap'));
  } catch (e) {
    if (e.status === 401) showAuth();
    else document.body.prepend(h('p', { style: 'padding:24px' }, 'Could not reach the server: ' + e.message));
  }
}
boot();
